<title>مصروفي – متتبّع الطالب العامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050909;--card:#0d1616;--card2:#132120;--line:#1c3130;--text:#eafffb;--muted:#7fa9a4;--t1:#5eead4;--t2:#14b8a6;--t3:#0d9488;--bad:#fb7185;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;max-width:520px;margin:0 auto;padding-bottom:96px;min-height:100vh}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.hero{position:relative;overflow:hidden;padding:28px 20px 78px;background:radial-gradient(120% 140% at 100% 0%,#0f766e 0%,#064e4a 38%,#050909 100%);border-radius:0 0 34px 34px}
.hero::after{content:"";position:absolute;width:220px;height:220px;left:-70px;bottom:-110px;border-radius:50%;background:radial-gradient(circle,rgba(94,234,212,.28),transparent 70%)}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--t1),var(--t3));color:#031311;display:grid;place-items:center;font-size:26px}
.today{position:relative;z-index:1;margin-top:18px;display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(94,234,212,.3);font-size:13px;font-weight:700;color:#d9fff9}.brand h1{font-size:22px;font-weight:800;letter-spacing:.2px}.brand p{font-size:13px;color:#a7ece2;margin-top:1px;font-weight:500}
main{padding:0 16px;margin-top:-52px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.bal{text-align:center;background:linear-gradient(160deg,#10201f,#0a1413);box-shadow:0 14px 40px rgba(20,184,166,.12)}
.bal small{color:var(--muted);font-size:13px;font-weight:500}
.bal b{display:block;font-size:38px;font-weight:800;margin:4px 0 14px;background:linear-gradient(90deg,var(--t1),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{border-radius:16px;padding:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.mini b{font-size:17px;font-weight:700;color:var(--text)}
.mini .d{display:flex;align-items:center;gap:6px}.mini .d i{width:8px;height:8px;border-radius:50%;background:var(--t1)}.mini.e .d i{background:var(--bad)}
h2{font-size:17px;font-weight:700;margin:0 2px 12px}
.sec{display:none}.sec.on{display:block}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}
.ic{width:42px;height:42px;border-radius:13px;background:var(--card2);border:1px solid var(--line);color:var(--t1);display:grid;place-items:center;font-size:21px;flex:none}
.item .m{flex:1;min-width:0}.item .m div{font-size:15px;font-weight:700}.item .m span{font-size:12px;color:var(--muted)}
.amt{font-weight:700;font-size:15px;direction:ltr}.amt.i{color:var(--t1)}.amt.e{color:var(--bad)}
.del{background:none;border:0;color:var(--muted);font-size:16px;padding:6px;border-radius:8px;cursor:pointer}.del:active{background:var(--card2)}
label{font-size:13px;color:var(--muted);display:block;margin:14px 0 6px;font-weight:500}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:15px;appearance:none;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--t2);box-shadow:0 0 0 3px rgba(20,184,166,.2)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:12px;font:inherit;color:var(--muted);font-weight:700;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--t2),var(--t3));color:#031311}
.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--t1),var(--t2));color:#031311;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.btn:active{transform:scale(.98)}
.bar{margin:14px 0}.bar .t{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px;color:var(--muted)}
.bar .t span:first-child{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500}.bar .t svg{color:var(--t1);font-size:17px}
.bar .b{height:8px;background:var(--card2);border-radius:8px;overflow:hidden}.bar .b i{display:block;height:100%;background:linear-gradient(90deg,var(--t3),var(--t1));border-radius:8px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;line-height:1.8;margin-top:16px}
.tip svg{font-size:22px;color:var(--t1);flex:none;margin-top:2px}.tip.w svg{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,14,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:500;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;cursor:pointer}
nav button svg{font-size:23px}nav button.on{color:var(--t1);font-weight:700}
nav button.on::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:3px;background:var(--t1)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:500}.setrow:last-child{border:0;padding-bottom:0}
.setrow em{font-style:normal;color:var(--muted);font-size:13px}
.setrow input{width:100px;text-align:center;padding:9px}
.setrow .wipe{background:none;border:1px solid var(--line);color:var(--bad);border-radius:10px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer}
.ver{user-select:none;-webkit-user-select:none;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;z-index:20;padding:24px}.modal.show{display:grid}
.pop{background:linear-gradient(160deg,#0f2523,#050909);border:1px solid var(--t3);border-radius:28px;padding:34px 24px 26px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 60px rgba(20,184,166,.25);animation:in .35s ease}
@keyframes in{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.pop .crown{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--t1),var(--t3));color:#031311;display:grid;place-items:center;font-size:38px}
.pop h3{font-size:22px;font-weight:800;line-height:1.7}
.pop p{font-size:18px;font-weight:700;color:var(--t1);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pop button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--t1),var(--t2));color:#031311;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="hero"><div class="brand"><div class="logo" data-i="shell"></div><div><h1>مصروفي</h1><p id="mlabel"></p></div></div><div class="today" id="today"></div></div>
<main>
<section class="sec on" id="s-home">
 <div class="card bal"><small>رصيد هذا الشهر</small><b id="bal"></b>
  <div class="row"><div class="mini"><span class="d"><i></i>الدخل</span><b id="inc"></b></div><div class="mini e"><span class="d"><i></i>المصروف</span><b id="exp"></b></div></div></div>
 <h2>آخر العمليات</h2><div class="card" id="list"></div>
</section>
<section class="sec" id="s-add">
 <div class="card"><h2>عملية جديدة</h2>
  <div class="seg" id="type"><button data-v="exp" class="on">مصروف</button><button data-v="inc">دخل</button></div>
  <label>الفئة</label><select id="cat"></select>
  <label>المبلغ</label><input id="amount" type="number" inputmode="decimal" placeholder="0.00">
  <label>التاريخ</label><input id="date" type="date">
  <label>ملاحظة (اختياري)</label><input id="note" placeholder="مثال: تذكرة الباص">
  <button class="btn" id="save">حفظ العملية</button></div>
</section>
<section class="sec" id="s-rep">
 <div class="card"><h2>التقرير الشهري</h2><label style="margin-top:0">الشهر</label><input type="month" id="month">
  <div class="row" style="margin-top:16px"><div class="mini"><span class="d"><i></i>الدخل</span><b id="r-i"></b></div><div class="mini e"><span class="d"><i></i>المصروف</span><b id="r-e"></b></div></div>
  <div class="mini" style="margin-top:10px">الرصيد<b id="r-b"></b></div>
  <h2 style="margin-top:22px">المصروف حسب الفئة</h2><div id="bars"></div><div id="tip"></div></div>
</section>
<section class="sec" id="s-set">
 <div class="card"><h2>الإعدادات</h2>
  <div class="setrow"><span>العملة</span><input id="cur" maxlength="6"></div>
  <div class="setrow"><span>مسح كل البيانات</span><button class="wipe" id="wipe">مسح</button></div>
  <div class="setrow ver" id="ver"><span>إصدار التطبيق</span><em>1.0.0</em></div>
 </div>
</section>
</main>
<nav><div id="nav">
 <button data-s="home" class="on"><span data-i="home"></span>الرئيسية</button>
 <button data-s="add"><span data-i="plus"></span>إضافة</button>
 <button data-s="rep"><span data-i="chart"></span>التقرير</button>
 <button data-s="set"><span data-i="sliders"></span>الإعدادات</button>
</div></nav>
<div class="modal" id="modal"><div class="pop"><div class="crown" data-i="crown"></div><h3>رغودا الملكة الجميلة<br>حبيبة محمد</h3><button id="close">نحب رغد</button></div></div>
<script>
const P={
shell:'<path d="M12 3C7 3 3 8 3 14c0 2 1 4 3 5h12c2-1 3-3 3-5 0-6-4-11-9-11z"/><path d="M12 3v16M8 5l-2 14M16 5l2 14"/>',
home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',plus:'<path d="M12 5v14M5 12h14"/>',
chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',sliders:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>',
crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
bus:'<rect x="4" y="4" width="16" height="13" rx="2.5"/><path d="M4 11h16M7 20v-3M17 20v-3"/>',
book:'<path d="M5 4h13a1 1 0 0 1 1 1v14H6a1 1 0 0 0-1 1z"/><path d="M5 20V4"/>',
cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
food:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',
receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7"/>',alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+(P[n]||P.receipt)+'</svg>';
const hydrate=()=>document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=ic(e.dataset.i)});
const CATS={inc:[["brief","راتب"],["gift","دخل إضافي"]],exp:[["bus","مواصلات"],["book","كتب"],["cap","رسوم"],["food","طعام"],["receipt","أخرى"]]};
const ICON={};[...CATS.inc,...CATS.exp].forEach(c=>ICON[c[1]]=c[0]);
let S={tx:[],cur:"د.ل"},type="exp";
const $=id=>document.getElementById(id);
try{const r=localStorage.getItem("masrofi");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("masrofi",JSON.stringify(S))}catch(e){}};
const fmt=n=>n.toLocaleString("en",{maximumFractionDigits:2})+" "+S.cur;
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const today=new Date();const ym=d=>d.slice(0,7);
let month=iso(new Date()).slice(0,7);
$("date").value=iso(new Date());$("month").value=month;$("cur").value=S.cur;
function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option>${c[1]}</option>`).join("")}
function sums(m){const t=S.tx.filter(x=>ym(x.d)==m);return{t,i:t.filter(x=>x.t=="inc").reduce((a,x)=>a+x.a,0),e:t.filter(x=>x.t=="exp").reduce((a,x)=>a+x.a,0)}}
function render(){
 const m=sums(month);
 $("mlabel").textContent="ملخص "+new Date(month+"-01").toLocaleDateString("ar",{month:"long",year:"numeric"});
 $("bal").textContent=fmt(m.i-m.e);$("inc").textContent=fmt(m.i);$("exp").textContent=fmt(m.e);
 $("r-i").textContent=fmt(m.i);$("r-e").textContent=fmt(m.e);$("r-b").textContent=fmt(m.i-m.e);
 const l=[...m.t].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,30);
 $("list").innerHTML=l.length?l.map(x=>`<div class="item"><div class="ic">${ic(ICON[x.c])}</div><div class="m"><div>${esc(x.c)}</div><span>${x.d}${x.n?" · "+esc(x.n):""}</span></div><div class="amt ${x.t=="inc"?"i":"e"}">${x.t=="inc"?"+":"−"}${fmt(x.a)}</div><button class="del" data-id="${x.id}" aria-label="حذف">${ic("x")}</button></div>`).join(""):'<div class="empty">لا توجد عمليات في هذا الشهر بعد</div>';
 const by={};m.t.filter(x=>x.t=="exp").forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
 const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 $("bars").innerHTML=ent.length?ent.map(([c,v])=>`<div class="bar"><div class="t"><span>${ic(ICON[c])}${esc(c)}</span><span>${fmt(v)} · ${Math.round(v/m.e*100)}%</span></div><div class="b"><i style="width:${v/m.e*100}%"></i></div></div>`).join(""):'<div class="empty">لا توجد مصاريف مسجّلة</div>';
 let tip="سجّل عملياتك لتظهر لك هنا خلاصة بسيطة عن شهرك.",w=false;
 if(m.i>0||m.e>0){if(m.e>m.i){w=true;tip="مصاريفك أكبر من دخلك هذا الشهر، راجع أكبر فئة صرف."}else{tip=`صرفت ${m.i?Math.round(m.e/m.i*100):0}% من دخلك وبقي لك ${fmt(m.i-m.e)}.`+(ent[0]?` أكبر بند: ${ent[0][0]}.`:"")}}
 $("tip").innerHTML=`<div class="tip ${w?"w":""}">${ic(w?"alert":"check")}<span>${tip}</span></div>`;
}
$("type").onclick=e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.v;[...$("type").children].forEach(x=>x.classList.toggle("on",x==b));fillCats()};
$("save").onclick=()=>{const a=parseFloat($("amount").value);if(!(a>0)){$("amount").focus();return}
 const d=$("date").value||iso(new Date());
 S.tx.push({id:Date.now(),t:type,c:$("cat").value,a,d,n:$("note").value.trim()});save();
 $("amount").value="";$("note").value="";month=ym(d);$("month").value=month;render();go("home")};
$("list").onclick=e=>{const b=e.target.closest(".del");if(!b)return;S.tx=S.tx.filter(x=>x.id!=b.dataset.id);save();render()};
$("month").onchange=e=>{if(e.target.value){month=e.target.value;render()}};
$("cur").oninput=e=>{S.cur=e.target.value||"د.ل";save();render()};
$("wipe").onclick=()=>{if(confirm("متأكد؟ ستُمسح كل البيانات.")){S.tx=[];save();render()}};
function go(s){document.querySelectorAll(".sec").forEach(x=>x.classList.toggle("on",x.id=="s-"+s));[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.s==s));scrollTo(0,0)}
$("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.s)};
let taps=0,tm;
$("ver").onclick=()=>{taps++;clearTimeout(tm);tm=setTimeout(()=>taps=0,4000);if(taps>=9){taps=0;$("modal").classList.add("show")}};
$("close").onclick=()=>$("modal").classList.remove("show");
let dt=false;$("date").onchange=()=>dt=true;
function tick(){const n=new Date();$("today").textContent=n.toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long",year:"numeric"});if(!dt)$("date").value=iso(n)}
setInterval(tick,30000);document.addEventListener("visibilitychange",tick);
hydrate();fillCats();render();tick();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
